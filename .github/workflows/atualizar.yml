name: Atualizar calendário

on:
  schedule:
    # 06:23 e 18:23 de Brasília (minuto fora da hora cheia de propósito:
    # o agendador do GitHub atrasa quando todo mundo marca :00)
    - cron: "23 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-calendario
  cancel-in-progress: false

jobs:
  atualizar:
    # Desde 26/10/2026 o site do clube recusa os IPs dos runners do GitHub
    # (HTTP 499 / conexão fechada). Roda no PC do mantenedor, numa conexão
    # residencial. Se o PC estiver desligado, o job espera na fila (até 24h).
    runs-on: [self-hosted, Windows, palmeiras]
    timeout-minutes: 15
    defaults:
      run:
        # o "bash" no PATH dessa máquina é o do WSL, e a política de execução
        # do Windows bloqueia scripts PowerShell; cmd e python não dependem disso
        shell: cmd
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      # setup-python exige administrador em runners Windows; usa o Python da
      # máquina. tzdata: o Windows não tem a base de fusos IANA do zoneinfo.
      - name: Preparar Python
        run: python -m pip install --quiet --disable-pip-version-check tzdata && python --version

      - name: Gerar o .ics
        run: python scripts/gerar_ics.py

      - name: Commitar se mudou
        shell: python
        run: |
          import pathlib, subprocess, sys

          # O workspace pode pertencer a outra conta que não a do serviço
          # (NETWORK SERVICE); sem isso o git recusa com "dubious ownership".
          BASE = ["git", "-c", f"safe.directory={pathlib.Path.cwd().as_posix()}"]

          def git(*args, capturar=False):
              r = subprocess.run([*BASE, *args], capture_output=capturar, text=True)
              if r.returncode != 0:
                  sys.exit(f"git {' '.join(args)} falhou ({r.returncode}): {r.stderr or ''}")
              return r.stdout

          mudou = git("status", "--porcelain", "docs", capturar=True).strip()
          if not mudou:
              print("Nada mudou.")
              sys.exit(0)
          git("config", "user.name", "github-actions[bot]")
          git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          git("add", "docs")
          git("commit", "-m", "calendário: atualização automática")
          git("push")
